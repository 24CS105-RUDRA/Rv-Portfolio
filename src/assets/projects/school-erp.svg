<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" data-background="#dbc9e4"><title>School Management System — academic operations connected</title><desc>Conceptual paper ledger links student, faculty, and administrator roles with academic workflows. The ERP is in development.</desc><rect width="800" height="1000" fill="#dbc9e4" /><text x="48" y="57" fill="#332640" font-size="15" font-family="monospace" letter-spacing="2">SCHOOL MANAGEMENT SYSTEM</text><text x="45" y="143" fill="#332640" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-3">One school.</text><text x="45" y="215" fill="#332640" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-3">Connected.</text><g fill="none" stroke="#8c6b9e" stroke-width="3"><path d="M166 350V410H410V460M400 350V460M634 350V410H410" /></g><path class="art-school-permission" d="M166 350V410H410V460M400 350V460M634 350V410H410" fill="none" stroke="#332640" stroke-width="4" stroke-dasharray="14 520" /><rect x="52" y="290" width="218" height="65" rx="32" fill="#332640" /><text x="161" y="331" fill="#f6f2e7" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" letter-spacing="1">STUDENT</text><rect x="286" y="290" width="218" height="65" rx="32" fill="#332640" /><text x="395" y="331" fill="#f6f2e7" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" letter-spacing="1">FACULTY</text><rect x="520" y="290" width="218" height="65" rx="32" fill="#332640" /><text x="629" y="331" fill="#f6f2e7" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" letter-spacing="1">ADMIN</text><g transform="translate(8 12) rotate(4 400 630)"><rect x="132" y="449" width="530" height="341" rx="9" fill="#ad90bd" /></g><g class="art-school-ledger"><rect x="112" y="444" width="558" height="350" rx="9" fill="#fbf6ed" stroke="#8c6b9e" stroke-width="2" /><text x="145" y="490" fill="#332640" font-size="15" font-family="monospace" letter-spacing="2">ACADEMIC RECORDS</text><path d="M143 517h496M143 576h496M143 635h496M143 694h496M143 753h496M323 517v236M516 517v236" stroke="#cbb8d4" stroke-width="1.5" /><text x="145" y="554" fill="#332640" font-family="Arial,Helvetica,sans-serif" font-size="20">Attendance</text><text x="338" y="554" fill="#7b6488" font-size="14" font-family="monospace">CLASS / SESSION</text><g class="art-school-check" style="--art-delay:-0.0s"><circle cx="575" cy="547" r="12" fill="#ccd6ac" /><path d="m569 547 4 4 8-9" stroke="#40512d" stroke-width="2" fill="none" /></g><text x="145" y="613" fill="#332640" font-family="Arial,Helvetica,sans-serif" font-size="20">Homework</text><text x="338" y="613" fill="#7b6488" font-size="14" font-family="monospace">TEACHING / TASKS</text><g class="art-school-check" style="--art-delay:-0.6s"><circle cx="575" cy="606" r="12" fill="#ccd6ac" /><path d="m569 606 4 4 8-9" stroke="#40512d" stroke-width="2" fill="none" /></g><text x="145" y="672" fill="#332640" font-family="Arial,Helvetica,sans-serif" font-size="20">Fees</text><text x="338" y="672" fill="#7b6488" font-size="14" font-family="monospace">ADMIN / RECORDS</text><g class="art-school-check" style="--art-delay:-1.2s"><circle cx="575" cy="665" r="12" fill="#ccd6ac" /><path d="m569 665 4 4 8-9" stroke="#40512d" stroke-width="2" fill="none" /></g><text x="145" y="731" fill="#332640" font-family="Arial,Helvetica,sans-serif" font-size="20">Materials</text><text x="338" y="731" fill="#7b6488" font-size="14" font-family="monospace">LEARNING / MEDIA</text><g class="art-school-check" style="--art-delay:-1.7999999999999998s"><circle cx="575" cy="724" r="12" fill="#ccd6ac" /><path d="m569 724 4 4 8-9" stroke="#40512d" stroke-width="2" fill="none" /></g></g><g class="art-school-stamp" transform="rotate(-12 620 785)"><rect x="523" y="758" width="192" height="55" rx="4" fill="#b4c18d" stroke="#52633a" stroke-width="2" /><text x="619" y="792" fill="#3345