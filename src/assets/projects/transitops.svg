<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" data-background="#2449d6"><title>TransitOps — movement coordinated</title><desc>Conceptual dispatch map with a vehicle travelling between stops and a dispatch manifest below.</desc><rect width="800" height="1000" fill="#2449d6" /><text x="48" y="57" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">TRANSITOPS / FLEET OPERATIONS</text><text x="45" y="145" fill="#f6f2e7" font-family="Arial,Helvetica,sans-serif" font-size="69" font-weight="700" letter-spacing="-3">Movement,</text><text x="45" y="218" fill="#f6f2e7" font-family="Arial,Helvetica,sans-serif" font-size="69" font-weight="700" letter-spacing="-3">coordinated.</text><g opacity=".18" stroke="#e7edff"><path d="M48 300H752M48 400H752M48 500H752M48 600H752M48 700H752M120 280V740M280 280V740M440 280V740M600 280V740" /></g><path d="M120 350H565V500H280V690H650" fill="none" stroke="#9fb6ff" stroke-width="26" stroke-linejoin="round" /><path class="art-transit-route" d="M120 350H565V500H280V690H650" fill="none" stroke="#f5f1dc" stroke-width="3" stroke-dasharray="9 14" /><rect x="111" y="341" width="18" height="18" rx="3" fill="#2449d6" stroke="#f6f2e7" stroke-width="3" /><text x="110" y="325" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">DEPOT</text><rect x="556" y="341" width="18" height="18" rx="3" fill="#2449d6" stroke="#f6f2e7" stroke-width="3" /><text x="555" y="325" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">DISPATCH</text><rect x="556" y="491" width="18" height="18" rx="3" fill="#2449d6" stroke="#f6f2e7" stroke-width="3" /><text x="555" y="475" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">TRIP</text><rect x="271" y="491" width="18" height="18" rx="3" fill="#2449d6" stroke="#f6f2e7" stroke-width="3" /><text x="270" y="475" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">SERVICE</text><rect x="271" y="681" width="18" height="18" rx="3" fill="#2449d6" stroke="#f6f2e7" stroke-width="3" /><text x="270" y="665" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">RETURN</text><g class="art-transit-vehicle"><rect x="96" y="330" width="48" height="40" rx="8" fill="#e7f395" stroke="#172766" stroke-width="3" /><path d="M106 341h21v12h-21Z" fill="#2449d6" /><path d="M134 341v14" stroke="#2449d6" stroke-width="3" /></g><circle cx="650" cy="690" r="14" fill="#e7f395" /><path d="m643 690 5 5 9-11" stroke="#2449d6" stroke-width="3" fill="none" /><g class="art-transit-ticket"><rect x="458" y="578" width="260" height="65" rx="4" fill="#f6f2e7" transform="rotate(-4 588 610)" /><text x="480" y="616" fill="#2449d6" font-size="15" font-family="monospace" letter-spacing="2">READY FOR DISPATCH</text></g><path d="M48 790H752" stroke="#9fb6ff" /><text x="48" y="828" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">ONE WORKFLOW. EVERY MOVING PART.</text><text x="48" y="865" fill="#bacbff" font-size="15" font-family="monospace" letter-spacing="2">VEHICLES</text><path d="M230 860H330" stroke="#f6f2e7" stroke-width="4" /><rect class="art-transit-ledger" x="342" y="855" width="10" height="10" fill="#e7f395" style="--art-delay:-0.0s" /><text x="48" y="895" fill="#bacbff" font-size="15" font-family="monospace" letter-spacing="2">DRIVERS</text><path d="M230 890H430" stroke="#f6f2e7" stroke-width="4" /><rect class="art-transit-ledger" x="442" y="885" width="10" height="10" fill="#e7f395" style="--art-delay:-0.7s" /><text x="48" y="925" fill="#bacbff" font-size="15" font-family="monospace" letter-spacing="2">TRIPS</text><path d="M230 920H535" stroke="#f6f2e7" stroke-width="4" /><rect class="art-transit-ledger" x="547" y="915" width="10" height="10" fill="#e7f395" style="--art-delay:-1.4s" /><text x="48" y="970" fill="#f6f2e7" font-size="15" font-family="monospace" letter-spacing="2">DISPATCH / MAINTENANCE / EXPENSES</text></svg>